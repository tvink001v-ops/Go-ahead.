<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Игра (Строгая загрузка)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
        /* Полупрозрачный чёрный слой загрузки */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            transition: opacity 0.5s ease;
        }
        #loadingOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loadingBarContainer {
            width: 300px;
            height: 6px;
            background: #333;
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
        }
        #loadingBar {
            width: 0%;
            height: 100%;
            background: #4CAF50;
            border-radius: 10px;
            transition: width 0.2s;
        }
        #loadingText {
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px black;
        }
        #loadingSub {
            font-size: 1rem;
            opacity: 0.7;
            margin-top: 5px;
        }
        #loadingError {
            color: #ff4444;
            font-size: 1rem;
            margin-top: 15px;
            display: none;
        }
        
        /* Меню (появляется только после загрузки) */
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            background: transparent;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #menu.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #menu > * { pointer-events: auto; }
        .btn {
            padding: 20px 60px;
            font-size: 2rem;
            font-weight: bold;
            background: rgba(76, 175, 80, 0.85);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(76, 175, 80, 0.3);
            transition: all 0.3s ease;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
            opacity: 0.5;
            pointer-events: none;
        }
        .btn.active {
            opacity: 1;
            pointer-events: auto;
        }
        .btn.active:hover { 
            transform: scale(1.1);
            background: rgba(56, 142, 60, 0.95);
            box-shadow: 0 0 80px rgba(76, 175, 80, 0.6);
            border-color: white;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 1rem;
            text-shadow: 0 0 10px black;
            display: none;
            z-index: 5;
        }
    </style>
</head>
<body>
    <!-- ЧЁРНЫЙ СЛОЙ ЗАГРУЗКИ -->
    <div id="loadingOverlay">
        <div id="loadingText">Загрузка моделей...</div>
        <div id="loadingSub">Idle / Walking / Dance</div>
        <div id="loadingBarContainer">
            <div id="loadingBar"></div>
        </div>
        <div id="loadingError"></div>
    </div>

    <!-- МЕНЮ (появляется после 100% загрузки) -->
    <div id="menu">
        <button id="startBtn" class="btn">ВОЙТИ В ИГРУ</button>
    </div>

    <div id="ui">
        <div>WASD — ходьба | Пробел — прыжок | B — танец</div>
        <div>Клик по экрану — захват мыши</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "peerjs": "https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import Peer from 'peerjs';
        
        // --- DOM элементы ---
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const loadingSub = document.getElementById('loadingSub');
        const loadingBar = document.getElementById('loadingBar');
        const loadingError = document.getElementById('loadingError');
        const menu = document.getElementById('menu');
        const startBtn = document.getElementById('startBtn');
        const ui = document.getElementById('ui');

        // --- Обновление прогресса ---
        function updateProgress(percent, text) {
            loadingBar.style.width = Math.min(100, percent) + '%';
            if (text) loadingText.textContent = text;
        }

        // --- Показ ошибки (загрузка не снимется) ---
        function showError(message) {
            loadingText.textContent = '❌ ОШИБКА ЗАГРУЗКИ';
            loadingText.style.color = '#ff4444';
            loadingError.textContent = message;
            loadingError.style.display = 'block';
            loadingSub.textContent = 'Проверьте консоль (F12)';
            console.error('❌ КРИТИЧЕСКАЯ ОШИБКА:', message);
        }

        // --- Сцена, Камера, Рендерер ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Небо
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 20);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // --- Освещение ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);
        
        // --- Бесконечная земля ---
        const groundTexture = new THREE.TextureLoader().load('https://raw.githubusercontent.com/tvink001v-ops/Go-ahead./main/1642522213_3-abrakadabra-fun-p-tekstura-travi-dlya-genplana-8.jpg');
        groundTexture.wrapS = THREE.RepeatWrapping;
        groundTexture.wrapT = THREE.RepeatWrapping;
        groundTexture.repeat.set(400, 400);
        
        const groundGeometry = new THREE.PlaneGeometry(2000, 2000);
        const groundMaterial = new THREE.MeshStandardMaterial({ map: groundTexture, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // --- Группа игрока ---
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // --- Переменные камеры ---
        let cameraAngleHorizontal = 0;
        let cameraAngleVertical = 0.5;
        let cameraDistance = 5;
        let isPlaying = false;
        let menuFlyTime = 0;
        
        // --- Загрузка FBX (ТОЛЬКО ВАШИ МОДЕЛИ) ---
        const fbxLoader = new FBXLoader();
        let mainModel = null;
        let mixer = null;
        let currentAction = null;
        let lastTime = performance.now() / 1000;
        const actions = {};
        let modelsLoaded = false;
        let loadError = false;

        async function loadModels() {
            try {
                // ССЫЛКИ НА ВАШИ МОДЕЛИ
                const modelUrl = 'https://raw.githubusercontent.com/tvink001v-ops/Go-ahead./500fc0429e62f2cd0267d381c944c66ae5342034/Idle%20(1).fbx';
                const walkUrl = 'https://raw.githubusercontent.com/tvink001v-ops/Go-ahead./3e271cedf51ef1d55cb50aa7be37fabc611dec37/Walking.fbx';
                const danceUrl = 'https://raw.githubusercontent.com/tvink001v-ops/Go-ahead./main/Silly%20Dancing.fbx';
                
                console.log('🚀 Начинаем загрузку моделей...');
                updateProgress(10, 'Загрузка Idle...');
                
                // Загружаем с прогрессом (3 файла = 100%)
                const loadWithProgress = (url, name, startPercent, endPercent) => {
                    return new Promise((resolve, reject) => {
                        fbxLoader.load(url, 
                            (fbx) => {
                                updateProgress(endPercent, `Загружено: ${name}`);
                                resolve(fbx);
                            },
                            (xhr) => {
                                const percent = startPercent + (xhr.loaded / xhr.total) * (endPercent - startPercent);
                                updateProgress(percent, `Загрузка ${name}...`);
                            },
                            (err) => reject(err)
                        );
                    });
                };
                
                // Загружаем последовательно с шагами по 30%
                const modelFbx = await loadWithProgress(modelUrl, 'Idle', 10, 40);
                const walkFbx = await loadWithProgress(walkUrl, 'Walking', 40, 70);
                const danceFbx = await loadWithProgress(danceUrl, 'Dance', 70, 100);
                
                updateProgress(100, '✅ Всё загружено!');
                console.log('✅ Все модели загружены успешно!');
                
                const scale = 0.01;
                modelFbx.scale.set(scale, scale, scale);
                const modelBox = new THREE.Box3().setFromObject(modelFbx);
                const modelCenter = modelBox.getCenter(new THREE.Vector3());
                modelFbx.position.sub(modelCenter);
                const modelMinY = modelBox.min.y * scale;
                modelFbx.position.y -= modelMinY;
                modelFbx.castShadow = true;
                modelFbx.receiveShadow = true;
                
                mainModel = modelFbx;
                
                const idleAnim = modelFbx.animations[0];
                const walkAnim = walkFbx.animations[0];
                const danceAnim = danceFbx.animations[0];
                
                if (idleAnim && walkAnim && danceAnim) {
                    mainModel.animations.push(walkAnim);
                    mainModel.animations.push(danceAnim);
                    
                    mixer = new THREE.AnimationMixer(mainModel);
                    
                    actions.idle = mixer.clipAction(idleAnim);
                    actions.walk = mixer.clipAction(walkAnim);
                    actions.dance = mixer.clipAction(danceAnim);
                    
                    actions.idle.timeScale = 1.0;
                    actions.dance.timeScale = 1.0;
                    actions.walk.timeScale = 1.4;
                    
                    actions.idle.play();
                    currentAction = actions.idle;
                }
                
                playerGroup.add(mainModel);
                modelsLoaded = true;
                
                // --- РАЗБЛОКИРОВКА ---
                setTimeout(() => {
                    loadingOverlay.classList.add('hidden');
                    menu.classList.add('visible');
                    startBtn.classList.add('active');
                }, 800);
                
            } catch (error) {
                loadError = true;
                showError(`Ошибка загрузки: ${error.message || error}`);
            }
        }
        
        // Запускаем загрузку
        loadModels();
        
        // --- Управление камерой ---
        document.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            cameraAngleHorizontal -= e.movementX * 0.005;
            cameraAngleVertical -= e.movementY * 0.005;
            cameraAngleVertical = Math.max(0.1, Math.min(1.5, cameraAngleVertical));
        });
        
        renderer.domElement.addEventListener('click', () => {
            if (isPlaying) renderer.domElement.requestPointerLock();
        });
        
        // --- Игровое состояние ---
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let verticalVelocity = 0;
        const gravity = -0.025;
        const jumpSpeed = 0.35;
        const groundY = 0;
        let isWalking = false;
        let isDancingMode = false;
        let currentAnimName = 'idle';
        
        document.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            switch(e.code) {
                case 'KeyW': keys.w = true; break;
                case 'KeyA': keys.a = true; break;
                case 'KeyS': keys.s = true; break;
                case 'KeyD': keys.d = true; break;
                case 'Space': e.preventDefault(); keys.space = true; break;
                case 'KeyB': e.preventDefault(); if (!isWalking) isDancingMode = !isDancingMode; break;
            }
        });
        document.addEventListener('keyup', (e) => {
            if (!isPlaying) return;
            switch(e.code) {
                case 'KeyW': keys.w = false; break;
                case 'KeyA': keys.a = false; break;
                case 'KeyS': keys.s = false; break;
                case 'KeyD': keys.d = false; break;
                case 'Space': keys.space = false; break;
            }
        });
        
        // --- MULTIPLAYER ---
        let peer = null;
        let conn = null;
        let otherPlayers = {};
        const FIXED_ROOM_ID = 'my-global-game-server-2026';
        
        async function startMultiplayer() {
            if (loadError || !modelsLoaded) {
                alert('Модели не загружены! Проверьте консоль (F12).');
                return;
            }
            
            peer = new Peer(FIXED_ROOM_ID, { debug: 2 });
            
            peer.on('open', (id) => {
                menu.style.display = 'none';
                ui.style.display = 'block';
                isPlaying = true;
            });
            
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    connectToHost(FIXED_ROOM_ID);
                }
            });
            
            peer.on('connection', (newConn) => {
                newConn.on('open', () => {
                    if (!conn) {
                        conn = newConn;
                        const remotePlayer = createRemotePlayer();
                        otherPlayers[newConn.peer] = remotePlayer;
                        sendMyState();
                        
                        conn.on('data', (data) => {
                            if (data.type === 'move') {
                                updateOtherPlayer(data);
                            }
                        });
                    }
                });
            });
        }

        function connectToHost(hostId) {
            const newConn = peer.connect(hostId, { reliable: true });
            
            newConn.on('open', () => {
                conn = newConn;
                menu.style.display = 'none';
                ui.style.display = 'block';
                isPlaying = true;
                
                conn.on('data', (data) => {
                    if (data.type === 'move') {
                        updateOtherPlayer(data);
                    }
                });
            });
        }
        
        function createRemotePlayer() {
            if (!mainModel) return null;
            const clone = mainModel.clone();
            clone.scale.set(0.01, 0.01, 0.01);
            clone.position.set(0, 0.2, 0);
            const remoteMixer = new THREE.AnimationMixer(clone);
            const remoteIdle = remoteMixer.clipAction(actions.idle.getClip());
            const remoteWalk = remoteMixer.clipAction(actions.walk.getClip());
            const remoteDance = remoteMixer.clipAction(actions.dance.getClip());
            remoteIdle.play();
            remoteWalk.play();
            remoteDance.play();
            remoteIdle.setEffectiveWeight(1);
            remoteWalk.setEffectiveWeight(0);
            remoteDance.setEffectiveWeight(0);
            
            scene.add(clone);
            return {
                model: clone,
                mixer: remoteMixer,
                idle: remoteIdle,
                walk: remoteWalk,
                dance: remoteDance,
                currentRemoteAnim: remoteIdle
            };
        }

        function updateOtherPlayer(data) {
            if (otherPlayers[data.id]) {
                const remote = otherPlayers[data.id];
                remote.model.position.set(data.x, data.y, data.z);
                remote.model.rotation.y = data.rotY;
                
                let newAction = null;
                if (data.anim === 'idle') newAction = remote.idle;
                else if (data.anim === 'walk') newAction = remote.walk;
                else if (data.anim === 'dance') newAction = remote.dance;
                
                if (newAction && remote.currentRemoteAnim !== newAction) {
                    remote.currentRemoteAnim.setEffectiveWeight(0);
                    newAction.setEffectiveWeight(1);
                    newAction.reset();
                    newAction.play();
                    remote.currentRemoteAnim = newAction;
                }
            }
        }

        function sendMyState() {
            if (conn) {
                conn.send({
                    type: 'move',
                    id: peer.id,
                    x: playerGroup.position.x,
                    y: playerGroup.position.y,
                    z: playerGroup.position.z,
                    rotY: playerGroup.rotation.y,
                    anim: currentAnimName
                });
            }
        }
        
        // --- Кнопка ВОЙТИ В ИГРУ (только если загружено) ---
        startBtn.addEventListener('click', () => {
            startMultiplayer();
        });
        
        // --- Плавное переключение анимаций ---
        function switchAnimation(newAction, name) {
            if (currentAction === newAction) return;
            if (currentAction) currentAction.fadeOut(0.1);
            newAction.reset().fadeIn(0.1).play();
            currentAction = newAction;
            currentAnimName = name;
        }

        // --- Игровой цикл ---
        function animate() {
            requestAnimationFrame(animate);
            
            const now = performance.now() / 1000;
            const delta = Math.min(now - lastTime, 0.05);
            lastTime = now;
            
            // Если модели загружаются — крутим камеру в меню
            if (!modelsLoaded && !loadError) {
                menuFlyTime += delta * 0.15;
                const radius = 35;
                const height = 12 + Math.sin(menuFlyTime * 0.3) * 3;
                const x = Math.sin(menuFlyTime) * radius;
                const z = Math.cos(menuFlyTime) * radius;
                
                camera.position.set(x, height, z);
                camera.lookAt(0, 0.5, 0);
            }
            
            // Игровая логика
            if (isPlaying && modelsLoaded) {
                const forward = new THREE.Vector3(-Math.sin(cameraAngleHorizontal), 0, -Math.cos(cameraAngleHorizontal));
                const right = new THREE.Vector3(Math.cos(cameraAngleHorizontal), 0, -Math.sin(cameraAngleHorizontal));
                
                const moveDirection = new THREE.Vector3(0, 0, 0);
                if (keys.w) moveDirection.add(forward);
                if (keys.s) moveDirection.sub(forward);
                if (keys.a) moveDirection.sub(right);
                if (keys.d) moveDirection.add(right);
                
                if (moveDirection.length() > 0) {
                    moveDirection.normalize();
                    playerGroup.position.x += moveDirection.x * speed;
                    playerGroup.position.z += moveDirection.z * speed;
                    isWalking = true;
                    const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
                    playerGroup.rotation.y = targetAngle;
                } else {
                    isWalking = false;
                }
                
                if (isWalking && isDancingMode) isDancingMode = false;
                
                if (isDancingMode && currentAction !== actions.dance) switchAnimation(actions.dance, 'dance');
                else if (isWalking && currentAction !== actions.walk) switchAnimation(actions.walk, 'walk');
                else if (!isWalking && currentAction !== actions.idle) switchAnimation(actions.idle, 'idle');
                
                if (keys.space && playerGroup.position.y <= groundY + 0.01) {
                    verticalVelocity = jumpSpeed;
                }
                verticalVelocity += gravity;
                playerGroup.position.y += verticalVelocity;
                if (playerGroup.position.y < groundY) {
                    playerGroup.position.y = groundY;
                    verticalVelocity = 0;
                }
                
                const cameraOffset = new THREE.Vector3(
                    Math.sin(cameraAngleHorizontal) * Math.cos(cameraAngleVertical) * cameraDistance,
                    Math.sin(cameraAngleVertical) * cameraDistance + 0.5,
                    Math.cos(cameraAngleHorizontal) * Math.cos(cameraAngleVertical) * cameraDistance
                );
                
                camera.position.copy(playerGroup.position.clone().add(cameraOffset));
                camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 0.5, 0)));
                
                if (conn) {
                    sendMyState();
                }
            }
            
            // Обновление анимаций
            if (mixer) {
                mixer.update(delta);
            }
            Object.values(otherPlayers).forEach(remote => {
                if (remote && remote.mixer) {
                    remote.mixer.update(delta);
                }
            });
            
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
