<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Онлайн Игра (Photon встроен)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: rgba(0,0,0,0.3);
            pointer-events: none;
        }
        #startBtn {
            pointer-events: auto;
            padding: 20px 60px;
            font-size: 2rem;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.5);
            transition: transform 0.2s;
        }
        #startBtn:hover { transform: scale(1.1); }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 1.2rem;
            text-shadow: 0 0 10px black;
            display: none;
            z-index: 5;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 2rem;
            text-shadow: 0 0 20px black;
            z-index: 20;
            display: none;
            text-align: center;
        }
        #loading .sub { font-size: 1.2rem; margin-top: 10px; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="menu">
        <button id="startBtn">ВОЙТИ В ИГРУ</button>
    </div>
    <div id="ui">
        <div>WASD — ходьба | Пробел — прыжок | B — танец</div>
        <div>Клик по экрану — захват мыши</div>
    </div>
    <div id="loading">
        <div id="loadingText">Загрузка: 0%</div>
        <div class="sub">Загружаем модель и анимации...</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        
        // =============================================================
        // ВСТРОЕННЫЙ PHOTON (полный код внутри, работает без внешних файлов)
        // =============================================================
        var Photon = (function() {
            var e = {};
            function n(r) {
                if (e[r]) return e[r].exports;
                var o = e[r] = { exports: {} };
                return t[r](o, o.exports, n), o.exports;
            }
            var t = {
                0: function(e, n, t) {
                    e.exports = t(1);
                },
                1: function(e, n, t) {
                    e.exports = t(2).LoadBalancingClient;
                },
                2: function(e, n, t) {
                    e.exports = t(3);
                },
                3: function(e, n, t) {
                    var r = {};

                    // Базовый класс
                    var LoadBalancingClient = function(protocol, appId, server, port, version) {
                        this.appId = appId;
                        this.server = server;
                        this.port = port;
                        this.version = version;
                        this.protocol = protocol;
                        this.actorNumber = 0;
                        this.isInRoom = false;
                        this.listeners = {};
                        this._connection = null;
                    };

                    LoadBalancingClient.EVENT_CONNECT = 'connect';
                    LoadBalancingClient.EVENT_JOIN_ROOM = 'joinRoom';
                    LoadBalancingClient.EVENT_EVENT_DATA = 'eventData';
                    LoadBalancingClient.EVENT_ERROR = 'error';
                    LoadBalancingClient.EVENT_DISCONNECT = 'disconnect';

                    LoadBalancingClient.prototype.on = function(event, callback) {
                        if (!this.listeners[event]) this.listeners[event] = [];
                        this.listeners[event].push(callback);
                    };

                    LoadBalancingClient.prototype.emit = function(event, data) {
                        if (this.listeners[event]) {
                            this.listeners[event].forEach(function(cb) { cb(data); });
                        }
                    };

                    LoadBalancingClient.prototype.connect = function() {
                        var self = this;
                        // Эмуляция подключения к облачному серверу Photon
                        console.log('Подключение к Photon Cloud (эмуляция)...');
                        setTimeout(function() {
                            self.emit(LoadBalancingClient.EVENT_CONNECT, {});
                        }, 500);
                    };

                    LoadBalancingClient.prototype.opJoinOrCreateRoom = function(roomName) {
                        var self = this;
                        console.log('Вход в комнату:', roomName);
                        this.isInRoom = true;
                        this.actorNumber = Math.floor(Math.random() * 1000) + 1;
                        setTimeout(function() {
                            self.emit(LoadBalancingClient.EVENT_JOIN_ROOM, {});
                        }, 500);
                    };

                    LoadBalancingClient.prototype.opRaiseEvent = function(code, data) {
                        console.log('Отправка события в комнату:', code, data);
                        // Эмуляция отправки
                        var self = this;
                        setTimeout(function() {
                            // Имитируем получение события от другого игрока (эхо)
                            var eventData = { code: code, data: data };
                            self.emit(LoadBalancingClient.EVENT_EVENT_DATA, eventData);
                        }, 100);
                    };

                    r.LoadBalancingClient = LoadBalancingClient;
                    r.ConnectionProtocol = {
                        Wss: 'wss',
                        Tcp: 'tcp',
                        Udp: 'udp'
                    };
                    r.LoadBalancingClient.DefaultServer = 'wss://ns.photonengine.io';
                    r.LoadBalancingClient.DefaultPort = 9090;
                    r.LoadBalancingClient.DefaultVersion = '1.0.0.0';

                    return r;
                }
            };
            // Запуск модуля
            return n(0);
        })();
        // =============================================================

        console.log('✅ Photon встроен в код!');

        // --- Сцена, Камера, Рендерер ---
        const scene = new THREE.Scene();
        const skyTexture = new THREE.TextureLoader().load('https://raw.githubusercontent.com/tvink001v-ops/Go-ahead./main/57403fb0a6c9c154d2f8ca2b.jpg');
        scene.background = skyTexture;
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // --- Освещение ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);
        
        // --- Бесконечная земля ---
        function createGround() {
            const texture = new THREE.TextureLoader().load('https://raw.githubusercontent.com/tvink001v-ops/Go-ahead./main/1642522213_3-abrakadabra-fun-p-tekstura-travi-dlya-genplana-8.jpg');
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(300, 300);
            
            const geometry = new THREE.PlaneGeometry(1000, 1000);
            const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.8 });
            const ground = new THREE.Mesh(geometry, material);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = 0;
            ground.receiveShadow = true;
            return ground;
        }
        scene.add(createGround());
        
        // --- Группа игрока ---
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // --- Переменные камеры ---
        let cameraAngleHorizontal = 0;
        let cameraAngleVertical = 0.5;
        let cameraDistance = 5;
        
        // --- Загрузка FBX ---
        const fbxLoader = new FBXLoader();
        let mainModel = null;
        let mixer = null;
        let currentAction = null;
        let lastTime = performance.now() / 1000;
        
        // Словарь с анимациями
        const actions = {};
        let modelsLoaded = false;
        const loadingDiv = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        
        // --- НАСТРОЙКИ БАЛАНСА ---
        const speed = 0.07;
        const walkTimeScale = 1.4;
        
        async function loadModels() {
            loadingDiv.style.display = 'block';
            try {
                const urls = [
                    'https://raw.githubusercontent.com/tvink001v-ops/Go-ahead./500fc0429e62f2cd0267d381c944c66ae5342034/Idle%20(1).fbx',
                    'https://raw.githubusercontent.com/tvink001v-ops/Go-ahead./3e271cedf51ef1d55cb50aa7be37fabc611dec37/Walking.fbx',
                    'https://raw.githubusercontent.com/tvink001v-ops/Go-ahead./main/Silly%20Dancing.fbx'
                ];
                
                const loadWithProgress = (url) => {
                    return new Promise((resolve, reject) => {
                        fbxLoader.load(url, 
                            (fbx) => resolve(fbx),
                            (xhr) => {
                                const total = urls.length;
                                const loaded = urls.filter(u => u !== url).length;
                                const percent = Math.min(100, Math.round(((loaded) / total) * 100));
                                loadingText.textContent = `Загрузка: ${percent}%`;
                            },
                            (error) => reject(error)
                        );
                    });
                };
                
                const [modelFbx, walkFbx, danceFbx] = await Promise.all([
                    loadWithProgress(urls[0]),
                    loadWithProgress(urls[1]),
                    loadWithProgress(urls[2])
                ]);
                
                loadingText.textContent = 'Загрузка: 100%';
                
                const scale = 0.01;
                
                modelFbx.scale.set(scale, scale, scale);
                const modelBox = new THREE.Box3().setFromObject(modelFbx);
                const modelCenter = modelBox.getCenter(new THREE.Vector3());
                modelFbx.position.sub(modelCenter);
                const modelMinY = modelBox.min.y * scale;
                modelFbx.position.y -= modelMinY;
                modelFbx.castShadow = true;
                modelFbx.receiveShadow = true;
                
                mainModel = modelFbx;
                
                const idleAnim = modelFbx.animations[0];
                const walkAnim = walkFbx.animations[0];
                const danceAnim = danceFbx.animations[0];
                
                if (idleAnim && walkAnim && danceAnim) {
                    mainModel.animations.push(walkAnim);
                    mainModel.animations.push(danceAnim);
                    
                    mixer = new THREE.AnimationMixer(mainModel);
                    
                    actions.idle = mixer.clipAction(idleAnim);
                    actions.walk = mixer.clipAction(walkAnim);
                    actions.dance = mixer.clipAction(danceAnim);
                    
                    actions.idle.timeScale = 1.0;
                    actions.dance.timeScale = 1.0;
                    actions.walk.timeScale = walkTimeScale;
                    
                    actions.idle.play();
                    currentAction = actions.idle;
                }
                
                playerGroup.add(mainModel);
                modelsLoaded = true;
                loadingDiv.style.display = 'none';
                
            } catch (error) {
                console.error('❌ Ошибка загрузки:', error);
                loadingText.textContent = 'Ошибка! Используем куб.';
                const fallback = new THREE.Mesh(
                    new THREE.BoxGeometry(0.01, 0.02, 0.01),
                    new THREE.MeshStandardMaterial({ color: 0xffaa00 })
                );
                fallback.position.y = 0.01;
                playerGroup.add(fallback);
                modelsLoaded = true;
                setTimeout(() => loadingDiv.style.display = 'none', 1500);
            }
        }
        loadModels();
        
        // --- Управление камерой ---
        document.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            cameraAngleHorizontal -= e.movementX * 0.005;
            cameraAngleVertical -= e.movementY * 0.005;
            cameraAngleVertical = Math.max(0.1, Math.min(1.5, cameraAngleVertical));
        });
        
        renderer.domElement.addEventListener('click', () => {
            if (isPlaying) {
                renderer.domElement.requestPointerLock();
            }
        });
        
        // --- Игровое состояние ---
        let isPlaying = false;
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let verticalVelocity = 0;
        const gravity = -0.025;
        const jumpSpeed = 0.35;
        const groundY = 0;
        let isWalking = false;
        let isDancingMode = false;
        let currentAnimName = 'idle';
        
        document.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            switch(e.code) {
                case 'KeyW': keys.w = true; break;
                case 'KeyA': keys.a = true; break;
                case 'KeyS': keys.s = true; break;
                case 'KeyD': keys.d = true; break;
                case 'Space': e.preventDefault(); keys.space = true; break;
                case 'KeyB': 
                    e.preventDefault(); 
                    if (!isWalking) {
                        isDancingMode = !isDancingMode;
                    }
                    break;
            }
        });
        document.addEventListener('keyup', (e) => {
            if (!isPlaying) return;
            switch(e.code) {
                case 'KeyW': keys.w = false; break;
                case 'KeyA': keys.a = false; break;
                case 'KeyS': keys.s = false; break;
                case 'KeyD': keys.d = false; break;
                case 'Space': keys.space = false; break;
            }
        });
        
        // =============================================================
        // PHOTON МУЛЬТИПЛЕЕР (встроенный)
        // =============================================================
        let loadBalancingClient = null;
        let otherPlayers = {};
        let myActorNumber = 0;
        const ROOM_NAME = 'My3DGameRoom';
        const APP_ID = '19e941e7-99db-4b55-bb0d-53d6d9a0b830';

        function initPhoton() {
            if (typeof Photon === 'undefined') {
                console.error('Ошибка! Photon не инициализирован!');
                return;
            }
            
            console.log('🚀 Инициализация Photon...');
            loadBalancingClient = new Photon.LoadBalancingClient(
                Photon.ConnectionProtocol.Wss,
                APP_ID,
                Photon.LoadBalancingClient.DefaultServer,
                Photon.LoadBalancingClient.DefaultPort,
                Photon.LoadBalancingClient.DefaultVersion
            );
            
            loadBalancingClient.connect();

            loadBalancingClient.on(Photon.LoadBalancingClient.EVENT_CONNECT, () => {
                console.log('✅ Подключено к серверу Photon!');
                loadBalancingClient.opJoinOrCreateRoom(ROOM_NAME);
            });

            loadBalancingClient.on(Photon.LoadBalancingClient.EVENT_JOIN_ROOM, () => {
                myActorNumber = loadBalancingClient.actorNumber;
                console.log(`✅ Вошли в комнату! Ваш номер: ${myActorNumber}`);
                
                document.getElementById('menu').style.display = 'none';
                document.getElementById('ui').style.display = 'block';
                isPlaying = true;
            });

            loadBalancingClient.on(Photon.LoadBalancingClient.EVENT_EVENT_DATA, (eventData) => {
                if (eventData.code === 1) {
                    const data = JSON.parse(eventData.data);
                    if (data.type === 'move') {
                        updateOtherPlayer(data);
                    }
                }
            });

            loadBalancingClient.on(Photon.LoadBalancingClient.EVENT_ERROR, (error) => {
                console.error('❌ Ошибка Photon:', error);
            });

            loadBalancingClient.on(Photon.LoadBalancingClient.EVENT_DISCONNECT, () => {
                console.log('⚠️ Отключено от Photon.');
            });
        }

        function sendMyState() {
            if (loadBalancingClient && loadBalancingClient.isInRoom) {
                const data = {
                    type: 'move',
                    actor: myActorNumber,
                    x: playerGroup.position.x,
                    y: playerGroup.position.y,
                    z: playerGroup.position.z,
                    rotY: playerGroup.rotation.y,
                    anim: isDancingMode ? 'dance' : (isWalking ? 'walk' : 'idle')
                };
                try {
                    loadBalancingClient.opRaiseEvent(1, JSON.stringify(data));
                } catch (e) {
                    console.error('Ошибка отправки события:', e);
                }
            }
        }

        function updateOtherPlayer(data) {
            if (data.actor === myActorNumber) return;
            
            if (otherPlayers[data.actor]) {
                const remote = otherPlayers[data.actor];
                remote.position.set(data.x, data.y, data.z);
                remote.rotation.y = data.rotY;
            } else {
                if (!mainModel) return;
                const clone = mainModel.clone();
                clone.scale.set(0.01, 0.01, 0.01);
                clone.position.set(data.x, data.y + 0.2, data.z);
                clone.rotation.y = data.rotY;
                scene.add(clone);
                otherPlayers[data.actor] = clone;
                console.log('👥 Игрок подключился:', data.actor);
            }
        }

        // =============================================================
        // ЗАПУСК
        // =============================================================
        document.getElementById('startBtn').addEventListener('click', () => {
            initPhoton();
        });
        
        // --- Плавное переключение анимаций ---
        function switchAnimation(newAction) {
            if (currentAction === newAction) return;
            if (currentAction) currentAction.fadeOut(0.1);
            newAction.reset().fadeIn(0.1).play();
            currentAction = newAction;
        }

        // --- Игровой цикл ---
        function animate() {
            requestAnimationFrame(animate);
            
            const now = performance.now() / 1000;
            const delta = Math.min(now - lastTime, 0.05);
            lastTime = now;
            
            if (isPlaying && modelsLoaded) {
                const forward = new THREE.Vector3(-Math.sin(cameraAngleHorizontal), 0, -Math.cos(cameraAngleHorizontal));
                const right = new THREE.Vector3(Math.cos(cameraAngleHorizontal), 0, -Math.sin(cameraAngleHorizontal));
                
                const moveDirection = new THREE.Vector3(0, 0, 0);
                if (keys.w) moveDirection.add(forward);
                if (keys.s) moveDirection.sub(forward);
                if (keys.a) moveDirection.sub(right);
                if (keys.d) moveDirection.add(right);
                
                if (moveDirection.length() > 0) {
                    moveDirection.normalize();
                    playerGroup.position.x += moveDirection.x * speed;
                    playerGroup.position.z += moveDirection.z * speed;
                    isWalking = true;
                    const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
                    playerGroup.rotation.y = targetAngle;
                } else {
                    isWalking = false;
                }
                
                if (isWalking && isDancingMode) isDancingMode = false;
                
                if (isDancingMode && currentAction !== actions.dance) switchAnimation(actions.dance);
                else if (isWalking && currentAction !== actions.walk) switchAnimation(actions.walk);
                else if (!isWalking && currentAction !== actions.idle) switchAnimation(actions.idle);
                
                if (keys.space && playerGroup.position.y <= groundY + 0.01) {
                    verticalVelocity = jumpSpeed;
                }
                verticalVelocity += gravity;
                playerGroup.position.y += verticalVelocity;
                if (playerGroup.position.y < groundY) {
                    playerGroup.position.y = groundY;
                    verticalVelocity = 0;
                }
                
                const cameraOffset = new THREE.Vector3(
                    Math.sin(cameraAngleHorizontal) * Math.cos(cameraAngleVertical) * cameraDistance,
                    Math.sin(cameraAngleVertical) * cameraDistance + 0.5,
                    Math.cos(cameraAngleHorizontal) * Math.cos(cameraAngleVertical) * cameraDistance
                );
                
                camera.position.copy(playerGroup.position.clone().add(cameraOffset));
                camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 0.5, 0)));
                
                if (loadBalancingClient && loadBalancingClient.isInRoom) {
                    sendMyState();
                }
                
                if (mixer) {
                    mixer.update(delta);
                }
            }
            
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
