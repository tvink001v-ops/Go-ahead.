<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Мультиплеер (Supabase)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 10; background: rgba(0,0,0,0.5); pointer-events: none; }
        #startBtn { pointer-events: auto; padding: 20px 60px; font-size: 2rem; background: #4CAF50; color: white; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 0 30px rgba(76, 175, 80, 0.5); transition: transform 0.2s; }
        #startBtn:hover { transform: scale(1.1); }
        #ui { position: absolute; bottom: 20px; left: 20px; color: white; font-size: 1.2rem; text-shadow: 0 0 10px black; display: none; z-index: 5; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 2rem; text-shadow: 0 0 20px black; z-index: 20; display: none; text-align: center; }
        #status { position: absolute; top: 20px; right: 20px; color: #00ff00; font-size: 1.2rem; text-shadow: 0 0 10px black; z-index: 5; display: none; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="menu"><button id="startBtn">ВОЙТИ В ИГРУ</button></div>
    <div id="ui"><div>WASD — ходьба | Пробел — прыжок | B — танец</div></div>
    <div id="loading"><div id="loadingText">Загрузка: 0%</div></div>
    <div id="status">⏳ Подключение к серверу...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

        // =============================================================
        // ВАШИ ДАННЫЕ SUPABASE
        // =============================================================
        const SUPABASE_URL = 'https://lpmpmcplydwcfrqoqz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwbXBtY3BseWR3Y2ZycW9xeiIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzQzNjU3NzQ0LCJleHAiOjIwNTkyMzM3NDR9.vB5_VwqIZJ-F0YBFZqRgFyXnV4yY3sKXOqI2B6v6rLM';
        // Замените ANON_KEY на ваш актуальный ключ из проекта Supabase
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const myId = Math.random().toString(36).substring(2, 10);
        const myName = "Игрок " + Math.floor(Math.random() * 100);

        // =============================================================
        // СЦЕНА
        // =============================================================
        const scene = new THREE.Scene();
        const skyTexture = new THREE.TextureLoader().load('https://raw.githubusercontent.com/tvink001v-ops/Go-ahead./main/57403fb0a6c9c154d2f8ca2b.jpg');
        scene.background = skyTexture;
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // --- Освещение ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);
        
        // --- Земля ---
        function createGround() {
            const texture = new THREE.TextureLoader().load('https://raw.githubusercontent.com/tvink001v-ops/Go-ahead./main/1642522213_3-abrakadabra-fun-p-tekstura-travi-dlya-genplana-8.jpg');
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping; texture.repeat.set(300, 300);
            const geometry = new THREE.PlaneGeometry(1000, 1000);
            const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.8 });
            const ground = new THREE.Mesh(geometry, material);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = 0;
            ground.receiveShadow = true;
            return ground;
        }
        scene.add(createGround());
        
        // --- Группа игрока ---
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // --- Камера ---
        let cameraAngleHorizontal = 0;
        let cameraAngleVertical = 0.5;
        let cameraDistance = 5;
        
        // =============================================================
        // ЗАГРУЗКА МОДЕЛИ
        // =============================================================
        const fbxLoader = new FBXLoader();
        let mainModel = null;
        let mixer = null;
        let currentAction = null;
        let lastTime = performance.now() / 1000;
        const actions = {};
        let modelsLoaded = false;
        const loadingDiv = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const speed = 0.07;
        
        async function loadModels() {
            loadingDiv.style.display = 'block';
            try {
                const urls = [
                    'https://raw.githubusercontent.com/tvink001v-ops/Go-ahead./500fc0429e62f2cd0267d381c944c66ae5342034/Idle%20(1).fbx',
                    'https://raw.githubusercontent.com/tvink001v-ops/Go-ahead./3e271cedf51ef1d55cb50aa7be37fabc611dec37/Walking.fbx',
                    'https://raw.githubusercontent.com/tvink001v-ops/Go-ahead./main/Silly%20Dancing.fbx'
                ];
                const [modelFbx, walkFbx, danceFbx] = await Promise.all([
                    new Promise((resolve) => fbxLoader.load(urls[0], resolve, undefined, () => resolve(null))),
                    new Promise((resolve) => fbxLoader.load(urls[1], resolve, undefined, () => resolve(null))),
                    new Promise((resolve) => fbxLoader.load(urls[2], resolve, undefined, () => resolve(null)))
                ]);
                
                if (!modelFbx) {
                    console.error('Не удалось загрузить модель');
                    loadingDiv.style.display = 'none';
                    return;
                }
                
                loadingText.textContent = '100%';
                const scale = 0.01;
                modelFbx.scale.set(scale, scale, scale);
                
                // Центрируем модель
                const box = new THREE.Box3().setFromObject(modelFbx);
                const center = box.getCenter(new THREE.Vector3());
                modelFbx.position.sub(center);
                modelFbx.position.y -= box.min.y * scale;
                
                mainModel = modelFbx;
                
                // Собираем анимации
                const idleAnim = modelFbx.animations[0];
                const walkAnim = walkFbx?.animations[0];
                const danceAnim = danceFbx?.animations[0];
                
                if (idleAnim && walkAnim && danceAnim) {
                    mainModel.animations.push(walkAnim, danceAnim);
                    mixer = new THREE.AnimationMixer(mainModel);
                    actions.idle = mixer.clipAction(idleAnim);
                    actions.walk = mixer.clipAction(walkAnim);
                    actions.dance = mixer.clipAction(danceAnim);
                    
                    // Начинаем с idle
                    actions.idle.play();
                    currentAction = actions.idle;
                } else {
                    console.warn('Не все анимации загружены');
                }
                
                playerGroup.add(mainModel);
                modelsLoaded = true;
                loadingDiv.style.display = 'none';
            } catch (e) { 
                console.error('Ошибка загрузки моделей:', e);
                loadingDiv.style.display = 'none';
            }
        }
        loadModels();
        
        // --- Управление ---
        let isPlaying = false;
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let verticalVelocity = 0;
        const gravity = -0.025;
        const jumpSpeed = 0.35;
        const groundY = 0;
        let isWalking = false;
        let isDancingMode = false;

        document.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            cameraAngleHorizontal -= e.movementX * 0.005;
            cameraAngleVertical -= e.movementY * 0.005;
            cameraAngleVertical = Math.max(0.1, Math.min(1.5, cameraAngleVertical));
        });
        
        renderer.domElement.addEventListener('click', () => {
            if (isPlaying) renderer.domElement.requestPointerLock();
        });

        document.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            switch(e.code) {
                case 'KeyW': keys.w = true; break;
                case 'KeyA': keys.a = true; break;
                case 'KeyS': keys.s = true; break;
                case 'KeyD': keys.d = true; break;
                case 'Space': e.preventDefault(); keys.space = true; break;
                case 'KeyB': e.preventDefault(); 
                    if (!isWalking) isDancingMode = !isDancingMode; 
                    break;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (!isPlaying) return;
            switch(e.code) {
                case 'KeyW': keys.w = false; break;
                case 'KeyA': keys.a = false; break;
                case 'KeyS': keys.s = false; break;
                case 'KeyD': keys.d = false; break;
                case 'Space': keys.space = false; break;
            }
        });

        function switchAnimation(newAction) {
            if (!newAction || currentAction === newAction) return;
            if (currentAction) currentAction.fadeOut(0.1);
            newAction.reset().fadeIn(0.1).play();
            currentAction = newAction;
        }

        // =============================================================
        // МУЛЬТИПЛЕЕР SUPABASE
        // =============================================================
        let otherPlayers = {};
        let isConnected = false;
        let updateInterval = null;

        function createOtherPlayer() {
            if (!mainModel) return null;
            const clone = mainModel.clone();
            
            // Масштабируем клон
            clone.scale.set(0.01, 0.01, 0.01);
            
            // Красим в красный цвет
            clone.traverse((child) => {
                if (child.isMesh) {
                    if (child.material) {
                        const material = child.material.clone();
                        material.color.setHex(0xcc3333);
                        child.material = material;
                    }
                }
            });
            
            return clone;
        }

        async function initMultiplayer() {
            document.getElementById('status').style.display = 'block';
            document.getElementById('status').textContent = '⏳ Регистрация...';
            
            try {
                // Проверяем соединение с таблицей
                const { error: testError } = await supabase
                    .from('players')
                    .select('id')
                    .limit(1);
                
                if (testError) {
                    console.error('Ошибка доступа к таблице players:', testError);
                    document.getElementById('status').textContent = '❌ Ошибка: создайте таблицу players';
                    return;
                }

                // Регистрируем игрока
                const { error: upsertError } = await supabase
                    .from('players')
                    .upsert({
                        id: myId,
                        name: myName,
                        x: 0, 
                        y: 0, 
                        z: 0, 
                        rot_y: 0,
                        last_seen: new Date().toISOString()
                    });
                
                if (upsertError) {
                    console.error('Ошибка регистрации:', upsertError);
                    document.getElementById('status').textContent = '❌ Ошибка регистрации';
                    return;
                }
                
                // Красим себя в золотой
                if (mainModel) {
                    mainModel.traverse((child) => {
                        if (child.isMesh) {
                            if (child.material) {
                                const material = child.material.clone();
                                material.color.setHex(0xffaa00);
                                material.emissive = new THREE.Color(0x442200);
                                child.material = material;
                            }
                        }
                    });
                }

                isConnected = true;
                document.getElementById('status').textContent = '✅ Онлайн';
                document.getElementById('menu').style.display = 'none';
                document.getElementById('ui').style.display = 'block';
                isPlaying = true;
                
                // Запускаем синхронизацию
                updateInterval = setInterval(syncLoop, 200);
                
            } catch (error) {
                console.error('Ошибка подключения:', error);
                document.getElementById('status').textContent = '❌ Ошибка соединения';
            }
        }

        async function syncLoop() {
            if (!isConnected || !isPlaying || !modelsLoaded) return;
            
            // 1. Отправляем свою позицию
            try {
                const { error: upsertError } = await supabase
                    .from('players')
                    .upsert({
                        id: myId,
                        name: myName,
                        x: playerGroup.position.x,
                        y: playerGroup.position.y,
                        z: playerGroup.position.z,
                        rot_y: playerGroup.rotation.y,
                        last_seen: new Date().toISOString()
                    });
                
                if (upsertError) {
                    console.warn('Ошибка отправки позиции:', upsertError);
                    return;
                }
            } catch (e) {
                console.warn('Ошибка отправки:', e);
                return;
            }

            // 2. Получаем других игроков
            try {
                const twoSecondsAgo = new Date(Date.now() - 4000).toISOString();
                const { data, error } = await supabase
                    .from('players')
                    .select('id, name, x, y, z, rot_y')
                    .gt('last_seen', twoSecondsAgo)
                    .neq('id', myId);
                
                if (error) {
                    console.warn('Ошибка получения игроков:', error);
                    return;
                }
                
                if (!data) return;

                // 3. Синхронизируем игроков
                const currentIds = data.map(p => p.id);
                
                // Удаляем отсутствующих игроков
                for (const key in otherPlayers) {
                    if (!currentIds.includes(key)) {
                        scene.remove(otherPlayers[key]);
                        delete otherPlayers[key];
                    }
                }
                
                // Добавляем или обновляем игроков
                for (const playerData of data) {
                    if (!otherPlayers[playerData.id]) {
                        const clone = createOtherPlayer();
                        if (clone) {
                            clone.position.set(
                                playerData.x || 0, 
                                playerData.y || 0, 
                                playerData.z || 0
                            );
                            clone.rotation.y = playerData.rot_y || 0;
                            scene.add(clone);
                            otherPlayers[playerData.id] = clone;
                        }
                    } else {
                        const clone = otherPlayers[playerData.id];
                        // Интерполяция позиции для плавности
                        const targetPos = new THREE.Vector3(
                            playerData.x || 0, 
                            playerData.y || 0, 
                            playerData.z || 0
                        );
                        clone.position.lerp(targetPos, 0.3);
                        clone.rotation.y = playerData.rot_y || 0;
                    }
                }
            } catch (e) {
                console.warn('Ошибка синхронизации:', e);
            }
        }

        document.getElementById('startBtn').addEventListener('click', initMultiplayer);

        // =============================================================
        // АНИМАЦИЯ
        // =============================================================
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now() / 1000;
            const delta = Math.min(now - lastTime, 0.05);
            lastTime = now;
            
            if (isPlaying && modelsLoaded) {
                const forward = new THREE.Vector3(
                    -Math.sin(cameraAngleHorizontal), 
                    0, 
                    -Math.cos(cameraAngleHorizontal)
                );
                const right = new THREE.Vector3(
                    Math.cos(cameraAngleHorizontal), 
                    0, 
                    -Math.sin(cameraAngleHorizontal)
                );
                const moveDirection = new THREE.Vector3(0, 0, 0);
                
                if (keys.w) moveDirection.add(forward);
                if (keys.s) moveDirection.sub(forward);
                if (keys.a) moveDirection.sub(right);
                if (keys.d) moveDirection.add(right);
                
                if (moveDirection.length() > 0) {
                    moveDirection.normalize();
                    playerGroup.position.x += moveDirection.x * speed;
                    playerGroup.position.z += moveDirection.z * speed;
                    isWalking = true;
                    playerGroup.rotation.y = Math.atan2(moveDirection.x, moveDirection.z);
                } else { 
                    isWalking = false; 
                }
                
                // Управление анимациями
                if (isWalking && isDancingMode) isDancingMode = false;
                
                if (isDancingMode && actions.dance && currentAction !== actions.dance) {
                    switchAnimation(actions.dance);
                } else if (isWalking && actions.walk && currentAction !== actions.walk) {
                    switchAnimation(actions.walk);
                } else if (!isWalking && actions.idle && currentAction !== actions.idle) {
                    switchAnimation(actions.idle);
                }
                
                // Прыжок
                if (keys.space && playerGroup.position.y <= groundY + 0.01) {
                    verticalVelocity = jumpSpeed;
                }
                
                verticalVelocity += gravity;
                playerGroup.position.y += verticalVelocity;
                
                if (playerGroup.position.y < groundY) { 
                    playerGroup.position.y = groundY; 
                    verticalVelocity = 0; 
                }
                
                // Камера
                const cameraOffset = new THREE.Vector3(
                    Math.sin(cameraAngleHorizontal) * Math.cos(cameraAngleVertical) * cameraDistance,
                    Math.sin(cameraAngleVertical) * cameraDistance + 0.5,
                    Math.cos(cameraAngleHorizontal) * Math.cos(cameraAngleVertical) * cameraDistance
                );
                
                camera.position.copy(playerGroup.position.clone().add(cameraOffset));
                camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 0.5, 0)));
                
                if (mixer) mixer.update(delta);
            }
            
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
